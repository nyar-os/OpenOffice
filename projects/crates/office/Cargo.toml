[package]
name = "open-office"
publish = false
version = "0.1.0"
edition = "2024"
description = "One CLI for OpenWord, OpenExcel, OpenPPT and OpenPDF"
license = "MPL-2.0"

[lib]
name = "open_office"
path = "src/lib.rs"

[[bin]]
name = "open-office"
path = "src/main.rs"

[dependencies]
open-word-document = { path = "../../../../OpenWord/projects/crates/model" }
open-excel-workbook = { path = "../../../../OpenExcel/projects/crates/model" }
open-ppt-deck = { path = "../../../../OpenPPT/projects/crates/deck" }
open-pdf-core = { path = "../../../../OpenPDF/projects/crates/pdf" }
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e", default-features = false, features = ["package-detect"] }
serde_json = "1"
