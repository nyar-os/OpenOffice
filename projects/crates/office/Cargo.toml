[package]
name = "open-office"
publish = false
version = "0.1.0"
edition = "2024"
description = "One CLI for OpenWord, OpenExcel, OpenPPT and OpenPDF"
license = "MPL-2.0"

[lib]
name = "open_office"
path = "src/lib.rs"

[[bin]]
name = "open-office"
path = "src/main.rs"

[dependencies]
open-word-document = { path = "../../../../OpenWord/projects/crates/model" }
open-excel-workbook = { path = "../../../../OpenExcel/projects/crates/model" }
open-ppt-deck = { path = "../../../../OpenPPT/projects/crates/deck" }
open-pdf-core = { path = "../../../../OpenPDF/projects/crates/pdf" }
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "0ece26c987992326cfb768934183e99ae473a118", default-features = false, features = ["package-detect"] }
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "0ece26c987992326cfb768934183e99ae473a118" }
serde_json = "1"

[dev-dependencies]
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "0ece26c987992326cfb768934183e99ae473a118" }
